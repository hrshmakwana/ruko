<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Attack Ruko — try to break the verdict</title>
    <meta
      name="description"
      content="Add any instruction you like to a real scam message and see whether Ruko can be talked into calling it safe."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for Latin. The script font for the chosen language is fetched at
         runtime by applyLanguage, so a Tamil user does not download Gujarati. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest icons; without this the home screen shows a
         screenshot of the page instead of the Ruko mark. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ruko" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/attack-main.tsx"></script>
  </body>
</html>
