AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Ruko - scam check API. Single stack: HTTP API + Lambda + S3 + DynamoDB + Bedrock.
  Serverless only, no idle cost.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
    Description: Short environment name, used in resource names.

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region used for the Bedrock Converse call.

  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: >
      Model id passed to Converse. Normally a cross-region inference profile id.
      Fallback if unavailable: us.amazon.nova-lite-v1:0

  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    Description: >
      The underlying foundation model behind BedrockModelId. Used only to scope the
      IAM policy. Must be kept in step with BedrockModelId.

  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, gemini, none]
    Description: >
      Which inference provider the check uses. bedrock keeps the message inside
      AWS and is preferred. gemini is the fallback while Bedrock access is being
      granted - with it, the message leaves AWS and is sent to Google, which the
      README and the app both say out loud. none runs the rules alone.

  GeminiModelId:
    Type: String
    Default: gemini-3.6-flash
    Description: Model name used when ModelProvider is gemini.

  GeminiKeyParam:
    Type: String
    Default: /ruko/prod/gemini-api-key
    Description: >
      SSM Parameter Store name (SecureString) holding the Gemini API key. The key
      is never in this template, in the repo, or in a log line.

  AppUrl:
    Type: String
    Default: "https://main.d1qvcci82uzrvx.amplifyapp.com"
    Description: Public site URL, used for the link inside guardian alert emails.

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: >
      CORS origins for the API. Tightened to the Amplify domain plus localhost once
      the frontend is deployed.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref RukoTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        BEDROCK_REGION: !Ref BedrockRegion
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MODEL_PROVIDER: !Ref ModelProvider
        GEMINI_MODEL_ID: !Ref GeminiModelId
        GEMINI_KEY_PARAM: !Ref GeminiKeyParam
        ALERT_TOPIC_ARN: !Ref AlertTopic
        APP_URL: !Ref AppUrl
        LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------- API ----
  RukoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        # Cheap by design: roughly 5 requests/second, burst 10.
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  # ------------------------------------------------------------ storage ----
  UploadsBucket:
    Type: AWS::S3::Bucket
    # Keep the bucket out of harm's way on a stack delete; it self-empties in 1 day.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ruko-uploads-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads-after-1-day
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 300

  # One topic for every family. Each guardian's subscription carries a filter
  # policy on family_code, so SNS does the routing and Ruko never keeps a list
  # of who to email. Free tier covers 1,000 emails a month.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "ruko-alerts-${Stage}"
      DisplayName: Ruko

  RukoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ruko-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------- functions ----
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-health"
      CodeUri: src/
      Handler: handlers.health.lambda_handler
      Timeout: 10
      MemorySize: 256
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /health
            Method: GET

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-check"
      CodeUri: src/
      Handler: handlers.check.lambda_handler
      Policies:
        - Statement:
            - Sid: BedrockInvokeChosenModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
        - Statement:
            # Only the one parameter, and only decryption through SSM itself.
            - Sid: ReadGeminiKey
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiKeyParam}"
            - Sid: DecryptGeminiKey
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
        - Statement:
            - Sid: ReadUploadedScreenshot
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
        - Statement:
            # Textract reads the words out of a screenshot so the rules engine
            # can run on them. DetectDocumentText only - no analysis APIs, and
            # no async jobs, so nothing is stored on Amazon's side.
            - Sid: ReadScreenshotText
              Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: "*"
        - Statement:
            - Sid: EmailGuardians
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /check
            Method: POST

  # Live call mode: a presigned Transcribe WebSocket for the browser, and the
  # rules engine over whatever Transcribe sends back. No audio reaches Lambda.
  LiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-live"
      CodeUri: src/
      Handler: handlers.live.lambda_handler
      Timeout: 10
      Policies:
        - Statement:
            - Sid: StreamCallAudioToTranscribe
              Effect: Allow
              Action:
                - transcribe:StartStreamTranscriptionWebSocket
              Resource: "*"
      Events:
        Token:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /live/token
            Method: POST
        Analyse:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /live/analyse
            Method: POST

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-report"
      CodeUri: src/
      Handler: handlers.report.lambda_handler
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /report
            Method: POST

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-upload-url"
      CodeUri: src/
      Handler: handlers.upload_url.lambda_handler
      Timeout: 10
      MemorySize: 256
      Policies:
        - Statement:
            - Sid: PresignUploadPut
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /upload-url
            Method: POST

  # ---------------------------------------------------------- guardian ----
  # One function for the whole guardian side: signup, login, the alert feed and
  # the directive. They share a code path and a table, and one warm Lambda
  # answers all four faster than four cold ones.
  GuardianFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-guardian"
      CodeUri: src/
      Handler: handlers.guardian.signup
      Timeout: 15
      MemorySize: 512
      Policies:
        - Statement:
            - Sid: SubscribeGuardianEmail
              Effect: Allow
              Action:
                - sns:Subscribe
              Resource: !Ref AlertTopic
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Signup:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /guardian/signup
            Method: POST

  GuardianLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-guardian-login"
      CodeUri: src/
      Handler: handlers.guardian.login
      Timeout: 15
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /guardian/login
            Method: POST

  GuardianAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-guardian-alerts"
      CodeUri: src/
      Handler: handlers.guardian.alerts
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /guardian/alerts
            Method: GET

  GuardianDirectiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-guardian-directive"
      CodeUri: src/
      Handler: handlers.guardian.directive
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /guardian/directive
            Method: POST

  # ------------------------------------------------------ parent side ----
  FamilyStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-family-status"
      CodeUri: src/
      Handler: handlers.family_status.status
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RukoTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /family/status
            Method: GET

  FamilyLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-family-link"
      CodeUri: src/
      Handler: handlers.family_status.link
      Timeout: 10
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RukoTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /family/link
            Method: POST

  PanicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ruko-${Stage}-panic"
      CodeUri: src/
      Handler: handlers.family_status.panic
      Timeout: 10
      MemorySize: 256
      Policies:
        - Statement:
            - Sid: EmailGuardians
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
        - DynamoDBCrudPolicy:
            TableName: !Ref RukoTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref RukoApi
            Path: /panic
            Method: POST

  # ----------------------------------------------------------- logging ----
  # Declared explicitly so retention is 7 days instead of "never expire".
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-health"
      RetentionInDays: 7

  CheckLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-check"
      RetentionInDays: 7

  UploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-upload-url"
      RetentionInDays: 7

  LiveLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-live"
      RetentionInDays: 7

  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-report"
      RetentionInDays: 7

  GuardianLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-guardian"
      RetentionInDays: 7

  GuardianLoginLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-guardian-login"
      RetentionInDays: 7

  GuardianAlertsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-guardian-alerts"
      RetentionInDays: 7

  GuardianDirectiveLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-guardian-directive"
      RetentionInDays: 7

  FamilyStatusLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-family-status"
      RetentionInDays: 7

  FamilyLinkLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-family-link"
      RetentionInDays: 7

  PanicLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/ruko-${Stage}-panic"
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Base URL of the Ruko API
    Value: !Sub "https://${RukoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  AlertTopicArn:
    Value: !Ref AlertTopic
  TableName:
    Value: !Ref RukoTable
  UploadsBucketName:
    Value: !Ref UploadsBucket
